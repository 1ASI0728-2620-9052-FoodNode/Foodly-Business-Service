spring.application.name=business-service
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/foodly_business?replicaSet=rs0}
spring.data.mongodb.uuid-representation=standard
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:amqp://localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s
business.events.exchange=${BUSINESS_EVENTS_EXCHANGE:foodly.business}
business.outbox.enabled=${OUTBOX_ENABLED:true}
business.outbox.delay-ms=${OUTBOX_DELAY_MS:1000}
business.iam.secret-base64=${IAM_JWT_SECRET_BASE64}
business.iam.issuer=${IAM_JWT_ISSUER:foodly-iam}
business.iam.audience=${IAM_JWT_AUDIENCE:foodly-business}
business.iam.owner-role=${IAM_OWNER_ROLE:HUARIQUE_OWNER}
business.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
business.cloudinary.api-key=${CLOUDINARY_API_KEY:}
business.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
